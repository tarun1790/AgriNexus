<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Modern Multi-Intensity Emerald & Golden Gradients -->
        <linearGradient id="vedaEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="50%" stop-color="#059669" />
            <stop offset="100%" stop-color="#022c1b" />
        </linearGradient>
        
        <linearGradient id="riceGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="40%" stop-color="#facc15" />
            <stop offset="80%" stop-color="#eab308" />
            <stop offset="100%" stop-color="#ca8a04" />
        </linearGradient>

        <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
            <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
        </linearGradient>

        <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Circular Emblem Shield Background -->
    <circle cx="60" cy="60" r="54" fill="#021a10" stroke="#059669" stroke-width="2.5" />
    <circle cx="60" cy="60" r="48" fill="none" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Satellite Orbit Ellipse (Spaceborne DPI Heritage) -->
    <ellipse cx="60" cy="60" rx="46" ry="18" transform="rotate(-30 60 60)" stroke="url(#orbitGlow)" stroke-width="1.8" fill="none" />
    <!-- Orbiting Satellite Spark Node -->
    <circle cx="96" cy="38" r="3" fill="#ffffff" filter="url(#glowEffect)" />
    <circle cx="96" cy="38" r="1.5" fill="#34d399" />

    <!-- Central Symmetrical Rice Panicles / Golden Grains -->
    
    <!-- Left Rice Stem & Grains -->
    <path d="M60 98 C56 75, 42 50, 36 32" stroke="#10b981" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Left Grains -->
    <path d="M36 32 C30 25, 26 31, 32 38 C38 43, 41 38, 36 32Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M41 42 C34 37, 30 43, 37 50 C43 55, 47 48, 41 42Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M46 54 C40 50, 37 56, 43 62 C49 67, 52 60, 46 54Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M51 68 C46 64, 43 70, 49 76 C54 80, 57 74, 51 68Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>

    <!-- Right Rice Stem & Grains -->
    <path d="M60 98 C64 75, 78 50, 84 32" stroke="#10b981" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Right Grains -->
    <path d="M84 32 C90 25, 94 31, 88 38 C82 43, 79 38, 84 32Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M79 42 C86 37, 90 43, 83 50 C77 55, 73 48, 79 42Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M74 54 C80 50, 83 56, 77 62 C71 67, 68 60, 74 54Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M69 68 C74 64, 77 70, 71 76 C66 80, 63 74, 69 68Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1"/>

    <!-- Central Apex Grain of Wisdom (Veda Flame Grain) -->
    <path d="M60 16 C54 26, 52 36, 60 44 C68 36, 66 26, 60 16Z" fill="url(#riceGold)" stroke="#ca8a04" stroke-width="1.2" filter="url(#glowEffect)" />
    <path d="M60 22 C57 28, 56 34, 60 38 C64 34, 63 28, 60 22Z" fill="#ffffff" opacity="0.7"/>

    <!-- Foundation Leaf Sheaths (Lush Greenery Base) -->
    <path d="M60 98 C45 92, 38 78, 42 66 C48 78, 54 88, 60 98Z" fill="url(#vedaEmerald)" stroke="#059669" stroke-width="1"/>
    <path d="M60 98 C75 92, 82 78, 78 66 C72 78, 66 88, 60 98Z" fill="url(#vedaEmerald)" stroke="#059669" stroke-width="1"/>
    <path d="M60 98 L60 52" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

    <!-- Base Jewel Star Node -->
    <circle cx="60" cy="98" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
</svg>
